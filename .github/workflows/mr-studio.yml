name: MR Studio · Campañas en borrador

on:
  pull_request:
    paths:
      - ".github/workflows/mr-studio.yml"
      - "scripts/mr_studio*.py"
      - "studio/**"
      - "tests/test_mr_studio.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mr-studio.yml"
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Proyecto para revisar
        type: choice
        options: [mr-direccion, mr-token-stage, mr-telegram, all]
        default: mr-direccion
        required: true
      force:
        description: Incluir release antigua
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: mr-studio-pilot
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar parser, licencia y modo borrador
        run: python -m unittest discover -s tests -p 'test_mr_studio.py' -v

  drafts:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar entorno audiovisual
        run: |
          python -m pip install "Pillow>=11,<13"
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -n 1
      - name: Detectar y redactar sin publicar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MR_STUDIO_AI_MODEL: ${{ vars.MR_STUDIO_AI_MODEL || 'gpt-5-mini' }}
          REPOSITORY: ${{ github.event_name == 'push' && 'mr-direccion' || github.event.inputs.repository || 'all' }}
          FORCE: ${{ github.event_name == 'push' && 'true' || github.event.inputs.force || 'false' }}
        run: |
          args=(--catalog studio/catalog.json --out studio/output --repo "$REPOSITORY" --issues)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python scripts/mr_studio.py "${args[@]}"
      - name: Montar vídeos MP4 con marca de borrador
        run: python scripts/mr_studio_render.py
      - uses: actions/upload-artifact@v4
        with:
          name: mr-studio-borradores
          path: studio/output/
          retention-days: 14
          if-no-files-found: warn
